# Resolver de Docker para nombres de contenedor
resolver 127.0.0.11 valid=30s ipv6=off;

# Ruta pública (archivos estáticos y enlaces dinámicos API/MCP con subrutas)
location ~ ^/s/(?<slug>[^/]+)(?<subpath>/.*)?$ {
    proxy_pass http://custom-links:8000/internal-resolve/$slug$subpath$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";

    # Streaming sin buffering (soporta SSE, MCP Streamable HTTP y long-polling)
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 300s;
    client_max_body_size 10m;
}

# Proxy interno real hacia el target (usado en mode="file" vía X-Accel-Redirect)
location ~ ^/_internal_proxy/(?<target_scheme>https?)/(?<target_host>[^/]+)(?<target_path>/.*)$ {
    internal;
    proxy_http_version 1.1;
    proxy_set_header Host $target_host;
    proxy_ssl_server_name on;
    proxy_ssl_name $target_host;
    proxy_buffering off;
    proxy_request_buffering off;

    # Oculta el Content-Disposition del origen para evitar cabeceras duplicadas
    proxy_hide_header Content-Disposition;

    # Buffer de cabeceras para orígenes con cabeceras grandes evitando error 502
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    proxy_pass $target_scheme://$target_host$target_path$is_args$args;
}

# Bloquea uso directo de API por el dominio público
location ^~ /api/ {
    return 404;
}

# Bloquea todo lo demás
location / {
    return 404;
}
