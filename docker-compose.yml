services:
  custom-links:
    image: urielx16/custom-links:latest
    container_name: custom-links
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/data
    networks:
      - shared_proxy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  custom-links-mcp:
    image: urielx16/custom-links:latest
    container_name: custom-links-mcp
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - MCP_TRANSPORT=http
      - MCP_PATH=/mcp
      - MCP_PORT=8001
      - MCP_HOST=0.0.0.0
    env_file:
      - .env
    command: [ "python", "/app/mcp/server.py" ]
    networks:
      - shared_proxy
    profiles:
      - mcp

networks:
  shared_proxy:
    external: true
    name: ${SHARED_PROXY_NETWORK}
